services:
  frame:
    image: hollow313/frame:latest
    # Pour compiler localement au lieu d'utiliser l'image Docker Hub, décommentez la ligne build :
    # build: .
    container_name: frame
    restart: unless-stopped
    ports:
      - "30018:30018"
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Paris
      - PORT=30018
      - NODE_ENV=production
      # Les variables suivantes peuvent être configurées ici ou via l'interface d'administration :
      # - TMDB_API_KEY=votre_cle_api_tmdb
      # - SEER_URL=http://serveur:5055
      # - SEER_API_KEY=votre_cle_api_seer
      # - SONARR_URL=http://serveur:8989
      # - SONARR_API_KEY=votre_cle_api_sonarr
      # - RADARR_URL=http://serveur:7878
      # - RADARR_API_KEY=votre_cle_api_radarr
      # - SIMKL_CLIENT_ID=votre_client_id_simkl
      # - SIMKL_CLIENT_SECRET=votre_client_secret_simkl
      # - JWT_SECRET=genere_automatiquement_au_premier_demarrage
      # - FRAME_ENCRYPTION_KEY=cle_optionnelle_aes256_pour_chiffrer_les_secrets_au_repos
      # - CORS_ORIGINS=https://frame.mondomaine.fr
      # - COOKIE_SECURE=false
      # - SSO_TRUSTED_PROXIES=127.0.0.1/32,172.16.0.0/12
      # - INTERNAL_HOSTS_ALLOWLIST=192.168.1.50,jellyfin,sonarr,radarr,overseerr
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:30018/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
      - ./config:/app/config
